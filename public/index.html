<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IP Location Dashboard</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}
.wrap{max-width:1100px;margin:30px auto;padding:20px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 30px #00000012;margin-bottom:18px}
h1{margin-top:0}.row{display:flex;gap:10px;flex-wrap:wrap}
input,button{padding:12px;border-radius:10px;border:1px solid #ccd3df}
button{cursor:pointer;background:#172033;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{text-align:left;padding:10px;border-bottom:1px solid #e7eaf0;font-size:14px}
.small{color:#667085;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>IP Location Dashboard</h1>
<p class="small">यह dashboard केवल IP से अनुमानित location दिखाता है। यह GPS location नहीं है।</p>
<div class="row">
<input id="key" placeholder="Admin key" type="password">
<button onclick="loadVisits()">Load visits</button>
<button onclick="clearVisits()">Clear</button>
</div>
</div>

<div class="card">
<h3>Tracking link</h3>
<p>इस server पर किसी भी ID का link बनाया जा सकता है:</p>
<code id="link"></code>
<p class="small">उदाहरण: /t/demo123</p>
</div>

<div class="card">
<table>
<thead><tr><th>Time</th><th>IP</th><th>Approx. location</th><th>Latitude</th><th>Longitude</th><th>Accuracy</th><th>Map</th><th>ISP</th></tr></thead>
<tbody id="rows"><tr><td colspan="4">No data</td></tr></tbody>
</table>
</div>
</div>
<script>
document.getElementById("link").textContent =
  location.origin + "/t/demo123";

async function loadVisits(){
  const key=document.getElementById("key").value;
  const r=await fetch("/api/visits",{headers:{"x-admin-key":key}});
  const data=await r.json();
  if(!r.ok){alert(data.error||"Unauthorized");return;}
  document.getElementById("rows").innerHTML=data.length?data.map(v=>`
    <tr>
      <td>${new Date(v.time).toLocaleString()}</td>
      <td>${v.ip}</td>
      <td>${v.city}, ${v.region}, ${v.country}</td>
      <td>${v.isp}</td>
    </tr>`).join(""):"<tr><td colspan='4'>No data</td></tr>";
}
async function clearVisits(){
  const key=document.getElementById("key").value;
  const r=await fetch("/api/visits",{method:"DELETE",headers:{"x-admin-key":key}});
  if(r.ok) loadVisits(); else alert("Unauthorized");
}
</script>
</body>
</html>
